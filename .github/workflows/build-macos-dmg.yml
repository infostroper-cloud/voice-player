name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach VoicePlayer.dmg (empty = latest)"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve release tag & source
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_TAG" ]; then
              TAG="$INPUT_TAG"
            else
              TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p src_pkg
          gh release download "$TAG" -p "*.zip" -D src_pkg || true
          ZIP_FILE=$(ls src_pkg/*.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE" -d src_app
          else
            cp -r . src_app
          fi
          APP_PATH=$(find src_app -name "app.py" | head -n 1)
          echo "app_dir=$(dirname "$APP_PATH")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          APP_DIR="${{ steps.rel.outputs.app_dir }}"
          if [ -f "$APP_DIR/requirements.txt" ]; then
            pip install -r "$APP_DIR/requirements.txt" || true
          fi
          pip install pyinstaller sounddevice numpy edge-tts miniaudio pillow lameenc audiotsm certifi aiohttp zstandard piper-tts ruaccent huggingface_hub pypdf onnxruntime

      - name: Generate macOS .icns icon & build VoicePlayer.app
        run: |
          APP_DIR="${{ steps.rel.outputs.app_dir }}"
          cd "$APP_DIR"

          ICON_FLAG=""
          PNG_SRC=""
          [ -f icon.png ] && PNG_SRC="icon.png"
          [ -z "$PNG_SRC" ] && [ -f "${{ github.workspace }}/icon.png" ] && PNG_SRC="${{ github.workspace }}/icon.png"
          [ -z "$PNG_SRC" ] && [ -f "${{ github.workspace }}/web/icon.png" ] && PNG_SRC="${{ github.workspace }}/web/icon.png"

          if [ -n "$PNG_SRC" ]; then
            mkdir -p VoicePlayer.iconset
            for sz in 16 32 128 256 512; do
              sips -z $sz $sz "$PNG_SRC" --out "VoicePlayer.iconset/icon_${sz}x${sz}.png" >/dev/null
              dbl=$((sz * 2))
              sips -z $dbl $dbl "$PNG_SRC" --out "VoicePlayer.iconset/icon_${sz}x${sz}@2x.png" >/dev/null
            done
            iconutil -c icns VoicePlayer.iconset -o VoicePlayer.icns
            ICON_FLAG="--icon VoicePlayer.icns"
          fi

          EXTRA_DATA=""
          [ -f VERSION ] && EXTRA_DATA="$EXTRA_DATA --add-data VERSION:."
          [ -f icon.png ] && EXTRA_DATA="$EXTRA_DATA --add-data icon.png:."
          [ -d hooks ] && EXTRA_DATA="$EXTRA_DATA --add-data hooks:hooks"

          pyinstaller --noconfirm --windowed --name VoicePlayer $ICON_FLAG $EXTRA_DATA \
            --osx-bundle-identifier com.voiceplayer.app \
            --collect-all edge_tts --collect-all sounddevice --collect-all miniaudio \
            --collect-all audiotsm --collect-all certifi --collect-all aiohttp \
            --collect-all zstandard --collect-all piper \
            --hidden-import vp_auth --hidden-import vp_watchers --hidden-import vp_ai --hidden-import vp_feed \
            --exclude-module torch --exclude-module transformers --exclude-module scipy \
            --exclude-module pandas --exclude-module matplotlib --exclude-module pytest \
            app.py

          # Ad-hoc sign bundle so Apple Silicon macOS allows launching it
          codesign --force --deep --sign - dist/VoicePlayer.app

      - name: Smoke-test VoicePlayer.app & package VoicePlayer.dmg
        run: |
          APP_DIR="${{ steps.rel.outputs.app_dir }}"
          cd "$APP_DIR"
          # Verify binary starts without immediate Python import/crash or 5s update-restart loop
          ./dist/VoicePlayer.app/Contents/MacOS/VoicePlayer &
          APP_PID=$!
          sleep 8
          if ! kill -0 $APP_PID 2>/dev/null; then
            wait $APP_PID || true
            echo "ERROR: VoicePlayer.app exited prematurely during smoke test!"
            exit 1
          fi
          kill $APP_PID 2>/dev/null || true

          mkdir -p dmg_stage
          cp -R dist/VoicePlayer.app dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "VoicePlayer" -srcfolder dmg_stage -ov -format UDZO "${{ github.workspace }}/VoicePlayer.dmg"

      - name: Upload VoicePlayer.dmg to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.rel.outputs.tag }}" "${{ github.workspace }}/VoicePlayer.dmg" --clobber
