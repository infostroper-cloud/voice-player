name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'vp_*.py'
      - '.github/workflows/build-dmg.yml'

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build macOS App with PyInstaller
        run: |
          pyinstaller --noconfirm packaging/VoicePlayer.spec

      - name: Prepare DMG root
        run: |
          mkdir -p dmg_root
          cp -R dist/VoicePlayer.app dmg_root/
          ln -s /Applications dmg_root/Applications
          cp VoicePlayer-macOS-Installer.command dmg_root/"Установка в 1 клик.command" 2>/dev/null || true
          chmod +x dmg_root/"Установка в 1 клик.command" 2>/dev/null || true
          cat << 'EOF' > dmg_root/README.txt
          ==========================================================
          🎧 VoicePlayer for macOS
          ==========================================================

          Установка:
            Перетащите VoicePlayer.app в папку Applications (Программы).

          Если macOS пишет «Apple не удалось подтвердить...»:
            1. Нажмите по VoicePlayer.app ПРАВОЙ кнопкой мыши (или Control + клик).
            2. Выберите «Открыть» (Open).
            3. В появившемся окне нажмите кнопку «Открыть».
            (Это стандартная защита macOS для программ не из App Store; 
             делается 1 раз, после чего приложение запускается обычным кликом).

          Либо снимите флаг одной командой в Терминале:
            xattr -cr /Applications/VoicePlayer.app
          ==========================================================
          EOF

      - name: Create DMG using hdiutil
        run: |
          hdiutil create -volname "VoicePlayer" -srcfolder dmg_root -ov -format UDZO VoicePlayer.dmg
          cp VoicePlayer.dmg VoicePlayer-1.2.0.dmg

      - name: Upload DMG to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload voice-player-v1.2.0 VoicePlayer.dmg VoicePlayer-1.2.0.dmg --clobber --repo infostroper-cloud/voice-player
